<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GM Table</title>
<style>
:root{--bg:#1b2430;--pn:#243142;--ln:#3a4a5e;--tx:#e8e4d8;--mu:#93a0b0;--ac:#5fb3a1;--rd:#c4524a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
#app{max-width:1100px;margin:auto;padding:12px}
header,nav,.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,button{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:6px 8px;font:inherit;min-width:0}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
nav button{border-radius:5px 5px 0 0;font-family:Georgia,serif;font-size:17px}
nav .on{background:var(--ac);color:#10201c;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px}
.f{display:flex;gap:4px;margin:3px 0}.f input:first-child{flex:1.2}.f input{flex:1;width:0}
.f span{flex:1}.f input[type=number]{flex:0 0 60px}
.t{font:bold 18px Georgia,serif;width:75%}
h4{margin:10px 0 4px;font-family:Georgia,serif;color:var(--ac)}
small{color:var(--mu)}
.cur{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.dead{opacity:.5}
.big{font:bold 34px Georgia,serif;color:var(--ac)}
.log{max-height:260px;overflow:auto;font-size:14px}
.danger{color:var(--rd)}
@media(prefers-reduced-motion:no-preference){button{transition:border-color .15s}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('gmtable'))}catch(x){}
if(!S||!S.camps)S={cur:null,camps:{}};
let tab='chars',expr='1d20',dlog=[];
const C=()=>S.camps[S.cur],K=()=>C().combat;
const save=()=>{try{localStorage.setItem('gmtable',JSON.stringify(S))}catch(x){alert('Could not save in this browser. Use Export.')}render()};
const mk=n=>({name:n,chars:[],items:[],combat:{round:1,turn:0,list:[],log:[],on:false}});
const iname=id=>{const i=C().items.find(i=>i.id==id);return i?i.name+(i.props.length?' ('+i.props.map(p=>p[0]+': '+p[1]).join(', ')+')':''):'(deleted item)'};
const log=m=>K().log.unshift(`R${K().round}: ${m}`);

/* campaigns */
function newC(){const n=prompt('Campaign name?');if(!n)return;const id=uid();S.camps[id]=mk(n);S.cur=id;save()}
function renC(){const n=prompt('New name?',C().name);if(n){C().name=n;save()}}
function delC(){if(confirm('Delete "'+C().name+'"? Export first if unsure.')){delete S.camps[S.cur];S.cur=Object.keys(S.camps)[0]||null;save()}}
function dl(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download=name+'.json';a.click()}
function expC(all){all?dl('gmtable-all',S):dl(C().name.replace(/\W+/g,'-'),{camps:{[S.cur]:C()}})}
function impF(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);Object.values(d.camps).forEach(c=>{const id=uid();S.camps[id]=c;S.cur=id});save()}catch(x){alert('That file is not a GM Table export.')}})}

/* characters */
const DEF=['Class','Level','HP','Max HP','AC','Init','Speed','STR','DEX','CON','INT','WIS','CHA'];
function addChar(){const n=prompt('Character name?');if(n){C().chars.push({name:n,fields:DEF.map(k=>[k,'']),inv:[]});save()}}
function addFld(i){const k=prompt('Field name? (e.g. Sanity, Spell Slots)');if(k){C().chars[i].fields.push([k,'']);save()}}
function addInv(i){const v=$('#s'+i).value;if(v){C().chars[i].inv.push({id:v,q:1});save()}}
const chars=()=>`<div class=row><button onclick="addChar()">+ Character</button><small>Every field is editable, add or remove any you like.</small></div><div class=grid>`+C().chars.map((p,i)=>`<div class=card>
<input class=t value="${e(p.name)}" onchange="C().chars[${i}].name=this.value;save()"><button class=danger onclick="if(confirm('Delete?')){C().chars.splice(${i},1);save()}">✕</button>
${p.fields.map((f,j)=>`<div class=f><input value="${e(f[0])}" onchange="C().chars[${i}].fields[${j}][0]=this.value;save()"><input value="${e(f[1])}" onchange="C().chars[${i}].fields[${j}][1]=this.value;save()"><button onclick="C().chars[${i}].fields.splice(${j},1);save()">−</button></div>`).join('')}
<button onclick="addFld(${i})">+ Field</button>
<h4>Inventory</h4>${p.inv.map((n,j)=>`<div class=f><span>${e(iname(n.id))}</span><input type=number value=${n.q} onchange="C().chars[${i}].inv[${j}].q=+this.value;save()"><button onclick="C().chars[${i}].inv.splice(${j},1);save()">−</button></div>`).join('')}
<div class=f><select id=s${i}>${C().items.map(t=>`<option value=${t.id}>${e(t.name)}</option>`).join('')}</select><button onclick="addInv(${i})">Add</button></div></div>`).join('')+`</div>`;

/* items */
function addItem(){const n=prompt('Item name?');if(n){C().items.push({id:uid(),name:n,desc:'',props:[['Type','']]});save()}}
function addProp(i){const k=prompt('Property? (e.g. Damage, Weight, Charges)');if(k){C().items[i].props.push([k,'']);save()}}
const items=()=>`<div class=row><button onclick="addItem()">+ Item</button><small>Items are shared by the whole campaign. Give them any properties, then add them to character inventories.</small></div><div class=grid>`+C().items.map((t,i)=>`<div class=card>
<input class=t value="${e(t.name)}" onchange="C().items[${i}].name=this.value;save()"><button class=danger onclick="if(confirm('Delete item?')){C().items.splice(${i},1);save()}">✕</button>
<input style="width:100%;margin:4px 0" placeholder="Description" value="${e(t.desc)}" onchange="C().items[${i}].desc=this.value;save()">
${t.props.map((f,j)=>`<div class=f><input value="${e(f[0])}" onchange="C().items[${i}].props[${j}][0]=this.value;save()"><input value="${e(f[1])}" onchange="C().items[${i}].props[${j}][1]=this.value;save()"><button onclick="C().items[${i}].props.splice(${j},1);save()">−</button></div>`).join('')}
<button onclick="addProp(${i})">+ Property</button></div>`).join('')+`</div>`;

/* combat */
function sortC(){const k=K(),cur=k.list[k.turn];k.list.sort((a,b)=>b.init-a.init);k.turn=Math.max(0,k.list.indexOf(cur))}
function addParty(){const k=K();C().chars.forEach(p=>{const g=n=>(p.fields.find(f=>f[0].toLowerCase()==n)||[0,''])[1];k.list.push({id:uid(),name:p.name,init:+g('init')||0,hp:+g('hp')||0,max:+g('max hp')||+g('hp')||0,note:''})});sortC();log('Party joins the fight');save()}
function addFoe(){const n=prompt('Name?');if(!n)return;const hp=+prompt('HP?','10')||0,init=+prompt('Initiative?','10')||0;K().list.push({id:uid(),name:n,init,hp,max:hp,note:''});sortC();log(n+' joins the fight');save()}
function hit(i,s){const k=K(),c=k.list[i],a=+$('#a'+i).value||0;if(!a)return;c.hp=Math.max(0,Math.min(c.max,c.hp+s*a));log(`${c.name} ${s<0?'takes '+a+' damage':'heals '+a} (${c.hp}/${c.max})`+(c.hp==0?' and is down':''));save()}
function nextT(){const k=K();if(!k.list.length)return;k.turn++;if(k.turn>=k.list.length){k.turn=0;k.round++;log('— Round '+k.round+' —')}log(k.list[k.turn].name+"'s turn");save()}
function endC(){if(confirm('End combat and clear the list?')){const k=K();log('Combat ended');k.list=[];k.turn=0;k.round=1;save()}}
function note(){const v=$('#ln').value.trim();if(v){log(v);save()}}
const combat=()=>{const k=K(),cur=k.list[k.turn],nx=k.list.length?k.list[(k.turn+1)%k.list.length]:null;return `<div class=row><button onclick="addParty()">+ Party</button><button onclick="addFoe()">+ Enemy</button><button onclick="nextT()">Next turn</button><button class=danger onclick="endC()">End combat</button></div>
<div class=card style="margin-bottom:10px"><div class=big>Round ${k.round}${cur?' · '+e(cur.name):''}</div><small>${nx?'Up next: '+e(nx.name):'Add combatants to begin.'}</small></div>
<div class=grid>`+k.list.map((c,i)=>`<div class="card ${i==k.turn?'cur':''} ${c.hp==0?'dead':''}"><b>${e(c.name)}</b>
<div class=f><span>Init</span><input type=number value=${c.init} onchange="K().list[${i}].init=+this.value;sortC();save()"><span>HP ${c.hp}/${c.max}</span></div>
<div class=f><input type=number id=a${i} placeholder="amount"><button onclick="hit(${i},-1)">Damage</button><button onclick="hit(${i},1)">Heal</button></div>
<div class=f><input placeholder="Conditions" value="${e(c.note)}" onchange="K().list[${i}].note=this.value;save()"><button onclick="K().list.splice(${i},1);K().turn=0;save()">−</button></div></div>`).join('')+`</div>
<h4>Combat log</h4><div class=row><input id=ln placeholder="Add a note…" style="flex:1" onkeydown="if(event.key=='Enter')note()"><button onclick="note()">Add</button><button onclick="K().log=[];save()">Clear</button></div><div class="card log">${k.log.map(l=>`<div>${e(l)}</div>`).join('')||'<small>Nothing logged yet.</small>'}</div>`};

/* dice */
function roll(x){const t=x.replace(/\s/g,'').match(/[+-]?[^+-]+/g);if(!t)return null;let sum=0,d=[];for(const s of t){const m=/^([+-]?)(\d*)d(\d+)$/i.exec(s),n=/^[+-]?\d+$/.test(s);if(m){const c=+m[2]||1,f=+m[3];if(c>100||f<1)return null;const r=Array.from({length:c},()=>1+Math.floor(Math.random()*f));sum+=(m[1]=='-'?-1:1)*r.reduce((a,b)=>a+b,0);d.push((m[1]||'')+'['+r.join(',')+']')}else if(n){sum+=+s;d.push(s)}else return null}return{sum,txt:d.join(' ').replace(/^\+/,'')}}
function doRoll(x,mode){x=x||expr;expr=x;let r;if(mode){const a=roll('1d20'),b=roll('1d20'),m=x.match(/[+-]\d+$/),mod=m?+m[0]:0,pick=mode=='adv'?Math.max(a.sum,b.sum):Math.min(a.sum,b.sum);r={sum:pick+mod,txt:`${a.sum} / ${b.sum} → ${pick}${mod?' '+(mod>0?'+':'')+mod:''}`};x=(mode=='adv'?'Adv ':'Dis ')+x}else r=roll(x);if(!r){alert('Try something like 2d6+3');return}dlog.unshift({x,...r});dlog=dlog.slice(0,30);render()}
const dice=()=>`<div class=row>${[4,6,8,10,12,20,100].map(n=>`<button onclick="doRoll('1d${n}')">d${n}</button>`).join('')}</div>
<div class=row><input id=ex value="${e(expr)}" onchange="expr=this.value" onkeydown="if(event.key=='Enter')doRoll(this.value)"><button onclick="doRoll($('#ex').value)">Roll</button><button onclick="doRoll($('#ex').value.match(/[+-]\\d+$/)?'1d20'+$('#ex').value.match(/[+-]\\d+$/)[0]:'1d20','adv')">Advantage</button><button onclick="doRoll($('#ex').value.match(/[+-]\\d+$/)?'1d20'+$('#ex').value.match(/[+-]\\d+$/)[0]:'1d20','dis')">Disadvantage</button></div>
${dlog[0]?`<div class=card><div class=big>${dlog[0].sum}</div><small>${e(dlog[0].x)}: ${e(dlog[0].txt)}</small></div>`:''}
<h4>History</h4><div class="card log">${dlog.map(r=>`<div><b>${r.sum}</b> <small>${e(r.x)}: ${e(r.txt)}</small> <button onclick="K().log.unshift('R'+K().round+': GM roll '+${r.sum});save()" title="Copy to combat log">log</button></div>`).join('')||'<small>No rolls yet.</small>'}</div>`;

/* shell */
const V={chars,items,combat,dice},L={chars:'Characters',items:'Items',combat:'Combat',dice:'Dice'};
function render(){const ids=Object.keys(S.camps);
let h=`<header><select aria-label="Campaign" onchange="S.cur=this.value;save()">${ids.map(i=>`<option value=${i} ${i==S.cur?'selected':''}>${e(S.camps[i].name)}</option>`).join('')||'<option>No campaigns</option>'}</select><button onclick="newC()">+ Campaign</button>${S.cur?`<button onclick="renC()">Rename</button><button onclick="delC()">Delete</button><button onclick="expC()">Export</button>`:''}<button onclick="expC(1)">Export all</button><button onclick="$('#imp').click()">Import</button><input id=imp type=file hidden accept=.json onchange="impF(this.files[0])"></header>`;
if(!S.cur){$('#app').innerHTML=h+'<p>Create a campaign to begin, or import a saved file.</p>';return}
h+=`<nav>${Object.keys(L).map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';render()">${L[t]}</button>`).join('')}</nav>`+V[tab]()+`<p><small>Saved in this browser automatically. Export to back up or move to another device.</small></p>`;
const f=document.activeElement&&document.activeElement.id;$('#app').innerHTML=h}
render();
</script></body></html>
